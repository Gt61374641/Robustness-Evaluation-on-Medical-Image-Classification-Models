<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .base { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
      .title { font-size: 30px; font-weight: 700; }
      .group { font-size: 26px; font-weight: 700; }
      .card-title { font-size: 27px; font-weight: 700; }
      .body { font-size: 24px; }
      .summary { font-size: 22px; font-weight: 700; fill: #334155; }
      .panel { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .card { fill: #ffffff; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 4; marker-end: url(#arrow); }
      .inner-flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="900" y="50" text-anchor="middle" class="base title">Unified evaluation workflow</text>

  <rect x="50" y="90" width="520" height="650" rx="10" class="panel"/>
  <rect x="50" y="90" width="520" height="68" rx="10" fill="#dce7f5" stroke="#1f4e79" stroke-width="2"/>
  <text x="76" y="134" class="base group" fill="#17324d">1  Study scope</text>
  <rect x="82" y="190" width="456" height="205" rx="8" class="card" stroke="#7a9bbf"/>
  <text x="108" y="228" class="base card-title">Datasets</text>
  <text x="108" y="274" class="base body">
    <tspan x="108" dy="0">Chest X-ray</tspan><tspan x="108" dy="34">Malaria microscopy</tspan><tspan x="108" dy="34">Retinal OCT</tspan>
  </text>
  <path d="M310 395 L310 458" class="inner-flow"/>
  <rect x="82" y="475" width="456" height="220" rx="8" class="card" stroke="#7a9bbf"/>
  <text x="108" y="513" class="base card-title">Model grid</text>
  <text x="108" y="559" class="base body">
    <tspan x="108" dy="0">ResNet-18/34/50/101/152</tspan><tspan x="108" dy="40">Extensions: DeiT-S, ConvNeXt-T</tspan><tspan x="108" dy="40">3 random seeds</tspan>
  </text>

  <path d="M570 415 L622 415" class="flow"/>

  <rect x="640" y="90" width="520" height="650" rx="10" class="panel"/>
  <rect x="640" y="90" width="520" height="68" rx="10" fill="#ddf0ea" stroke="#2f6f5e" stroke-width="2"/>
  <text x="666" y="134" class="base group" fill="#1e5145">2  Robustness evaluation</text>
  <rect x="672" y="190" width="456" height="205" rx="8" class="card" stroke="#65a38f"/>
  <text x="698" y="228" class="base card-title">Attack suite</text>
  <text x="698" y="274" class="base body">
    <tspan x="698" dy="0">FGSM / PGD budget sweeps</tspan><tspan x="698" dy="40">CW and DeepFool</tspan><tspan x="698" dy="40">Square Attack and AutoAttack</tspan>
  </text>
  <path d="M900 395 L900 458" class="inner-flow"/>
  <rect x="672" y="475" width="456" height="220" rx="8" class="card" stroke="#65a38f"/>
  <text x="698" y="513" class="base card-title">Outcome measures</text>
  <text x="698" y="559" class="base body">
    <tspan x="698" dy="0">Clean / conditional robust accuracy</tspan><tspan x="698" dy="40">nAUC and critical epsilon</tspan><tspan x="698" dy="40">Per-seed summaries</tspan>
  </text>

  <path d="M1160 415 L1212 415" class="flow"/>

  <rect x="1230" y="90" width="520" height="650" rx="10" class="panel"/>
  <rect x="1230" y="90" width="520" height="68" rx="10" fill="#f5e8d7" stroke="#9a642a" stroke-width="2"/>
  <text x="1256" y="134" class="base group" fill="#6b421c">3  Defence and audit</text>
  <rect x="1262" y="190" width="456" height="205" rx="8" class="card" stroke="#c08b51"/>
  <text x="1288" y="228" class="base card-title">Defence study</text>
  <text x="1288" y="274" class="base body">
    <tspan x="1288" dy="0">PGD-AT, TRADES and MART</tspan><tspan x="1288" dy="40">99 seed-level training runs</tspan><tspan x="1288" dy="40">All seeds retained</tspan>
  </text>
  <path d="M1490 395 L1490 458" class="inner-flow"/>
  <rect x="1262" y="475" width="456" height="220" rx="8" class="card" stroke="#c08b51"/>
  <text x="1288" y="513" class="base card-title">Reliability audit</text>
  <text x="1288" y="559" class="base body">
    <tspan x="1288" dy="0">PGD-50 with 5 restarts</tspan><tspan x="1288" dy="40">AutoAttack cross-check</tspan><tspan x="1288" dy="40">Collapse / failures reported</tspan>
  </text>

  <rect x="220" y="790" width="1360" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="834" text-anchor="middle" class="base summary">Unified protocol: modality  x  architecture  x  attack  x  budget  x  defence</text>
</svg>
